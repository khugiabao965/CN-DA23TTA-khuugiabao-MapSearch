<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bản đồ tương tác - Tìm kiếm địa điểm</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bản đồ toàn màn hình -->
  <div id="map"></div>

  <!-- Thanh tìm kiếm nổi -->
  <form id="search-form" class="gm-search" autocomplete="off">
    <input type="text" id="search-input" placeholder="Tìm kiếm địa điểm trên bản đồ" aria-label="Tìm kiếm địa điểm">
    <button type="button" id="clear-btn" class="gm-icon-btn d-none" title="Xóa" aria-label="Xóa từ khóa">✕</button>
    <button type="submit" class="gm-icon-btn gm-search-btn" title="Tìm kiếm" aria-label="Tìm kiếm">🔍</button>
  </form>

  <!-- Các nút lọc nhanh -->
  <div id="quick-filters" class="gm-chips">
    <button type="button" class="gm-chip" data-type="trường học">🏫 Trường học</button>
    <button type="button" class="gm-chip" data-type="bệnh viện">🏥 Bệnh viện</button>
    <button type="button" class="gm-chip" data-type="quán ăn">🍜 Quán ăn</button>
    <button type="button" class="gm-chip" data-type="ngân hàng">🏦 Ngân hàng</button>
  </div>

  <!-- Nút tài khoản -->
  <button type="button" id="account-btn" class="gm-account" aria-label="Tài khoản">
    <span aria-hidden="true">👤</span> <span id="account-label" class="gm-account-label">Đăng nhập</span>
  </button>

  <!-- Bảng kết quả / yêu thích -->
  <aside id="panel" class="gm-panel">
    <div class="gm-tabs">
      <button type="button" class="gm-tab active" data-tab="results">Kết quả</button>
      <button type="button" class="gm-tab" data-tab="favorites">
        ⭐ Yêu thích <span id="fav-count" class="gm-badge">0</span>
      </button>
      <button type="button" id="panel-toggle" class="gm-toggle" title="Thu gọn / mở rộng" aria-label="Thu gọn hoặc mở rộng bảng">▾</button>
    </div>
    <div class="gm-body">
      <ul id="results-list" class="list-group list-group-flush">
        <li class="list-group-item text-muted">Nhập từ khóa hoặc chọn một loại địa điểm để bắt đầu.</li>
      </ul>
      <ul id="favorites-list" class="list-group list-group-flush d-none"></ul>
    </div>
  </aside>

  <!-- Nút vị trí của tôi -->
  <button type="button" id="locate-btn" class="gm-fab" title="Vị trí của tôi" aria-label="Vị trí của tôi">📍</button>

  <!-- Đăng nhập / đăng ký -->
  <dialog id="auth-dialog" class="gm-dialog" aria-labelledby="auth-title">
    <form id="auth-form">
      <h2 id="auth-title" class="h5 mb-3">Đăng nhập</h2>
      <p id="auth-hint" class="text-muted small d-none"></p>
      <div class="mb-3">
        <label for="auth-username" class="form-label">Tên đăng nhập</label>
        <input type="text" id="auth-username" class="form-control" autocomplete="username" required minlength="3" maxlength="30">
      </div>
      <div class="mb-3">
        <label for="auth-password" class="form-label">Mật khẩu</label>
        <input type="password" id="auth-password" class="form-control" autocomplete="current-password" required minlength="8" maxlength="128">
        <div id="auth-password-help" class="form-text d-none">Mật khẩu có ít nhất 8 ký tự.</div>
      </div>
      <div id="auth-error" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" data-close-dialog>Đóng</button>
        <button type="submit" id="auth-submit" class="btn btn-primary">Đăng nhập</button>
      </div>
      <button type="button" id="auth-switch" class="btn btn-link btn-sm px-0 mt-2">Chưa có tài khoản? Đăng ký</button>
    </form>
  </dialog>

  <!-- Tài khoản -->
  <dialog id="account-dialog" class="gm-dialog" aria-labelledby="account-title">
    <h2 id="account-title" class="h5 mb-1"></h2>
    <p id="account-role" class="text-muted small mb-3"></p>
    <a id="admin-link" href="/admin.html" class="btn btn-outline-primary btn-sm w-100 mb-3 d-none">Mở trang quản trị</a>

    <form id="password-form">
      <h3 class="h6">Đổi mật khẩu</h3>
      <div class="mb-2">
        <label for="current-password" class="form-label small">Mật khẩu hiện tại</label>
        <input type="password" id="current-password" class="form-control form-control-sm" autocomplete="current-password" required minlength="8" maxlength="128">
      </div>
      <div class="mb-2">
        <label for="new-password" class="form-label small">Mật khẩu mới</label>
        <input type="password" id="new-password" class="form-control form-control-sm" autocomplete="new-password" required minlength="8" maxlength="128">
      </div>
      <div id="password-error" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <button type="submit" class="btn btn-outline-secondary btn-sm">Đổi mật khẩu</button>
    </form>

    <hr>
    <div class="d-flex justify-content-between">
      <button type="button" id="logout-btn" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-close-dialog>Đóng</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/location.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
</body>
</html>
